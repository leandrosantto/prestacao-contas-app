<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Aplicativo descontinuado</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f9;color:#475569;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;text-align:center;padding:24px}p{max-width:34ch;line-height:1.6;font-size:15px}</style>
</head>
<body>
<p>Este aplicativo foi descontinuado e não está mais disponível.</p>
<script>
// Remove o service worker e o cache da versão antiga nos aparelhos onde o app foi instalado.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
}
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
</script>
</body>
</html>
